name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Validate Angular UI Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run complete validation in Docker
        run: ./bin/check

      - name: Retain QA captures and browser reports for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/testbed/
          if-no-files-found: warn
          retention-days: 14
