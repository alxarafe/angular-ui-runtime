<label [for]="context().id">{{ context().label }}</label>
<textarea
    #control
    [id]="context().id"
    [value]="text()"
    [disabled]="context().disabled ?? false"
    [readOnly]="context().readOnly ?? false"
    (input)="update(control.value)"
></textarea>
