<label [for]="context().id">{{ context().label }}</label>
<select #control [id]="context().id" [disabled]="context().disabled || context().readOnly"
  (change)="selectIndex(control.selectedIndex)">
  <option [selected]="context().value === null">Not set</option>
  @for (choice of context().choices ?? []; track $index) {
    <option [value]="choice" [selected]="choice === text() && context().value !== null">{{ choice === '' ? '(empty string)' : choice }}</option>
  }
</select>
