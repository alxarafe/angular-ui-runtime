<div class="aur-cyberpunk-shell">
  <header class="aur-cyberpunk-heading">
    <ng-content select='[aur-theme-region="topbar-start"]' />
    <ng-content select="[aur-shell-heading]" />
  </header>
  <div class="aur-cyberpunk-workspace">
    <aside class="aur-cyberpunk-navigation">
      <ng-content select='[aur-theme-region="navigation-before"]' />
      <aur-theme-navigation [items]="navigation()" (selected)="navigationSelected.emit($event)" />
      <ng-content select='[aur-theme-region="navigation-after"]' />
    </aside>
    <main>
      <ng-content select='[aur-theme-region="contextual-actions"]' />
      <ng-content select='[aur-theme-region="content-before"]' />
      <aur-theme-panel><ng-content select="[aur-shell-content]" /></aur-theme-panel>
      <ng-content select='[aur-theme-region="content-after"]' />
      <div><ng-content /></div>
    </main>
  </div>
  <aside class="aur-cyberpunk-tools" aria-label="Optional tools">
    <ng-content select='[aur-theme-region="topbar-actions"]' />
    <ng-content select='[aur-theme-region="floating-actions"]' />
  </aside>
  <footer class="aur-cyberpunk-footer">
    <ng-content select="[aur-shell-footer]" /><ng-content select='[aur-theme-region="footer"]' />
  </footer>
</div>
